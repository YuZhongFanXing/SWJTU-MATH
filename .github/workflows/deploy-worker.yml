name: Deploy Upload Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
          OAUTH_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
          APP_ID: ${{ secrets.GITHUB_APP_ID }}
          INSTALLATION_ID: ${{ secrets.GITHUB_INSTALLATION_ID }}
          APP_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          for value in "$CF_TOKEN" "$CF_ACCOUNT" "$OAUTH_ID" "$OAUTH_SECRET" "$APP_ID" "$INSTALLATION_ID" "$APP_KEY" "$SESSION_SECRET"; do
            test -n "$value" || { echo "A required repository secret is missing"; exit 1; }
          done
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.50.0"
          secrets: |
            GITHUB_OAUTH_CLIENT_ID
            GITHUB_OAUTH_CLIENT_SECRET
            GITHUB_APP_ID
            GITHUB_INSTALLATION_ID
            GITHUB_APP_PRIVATE_KEY
            SESSION_SECRET
        env:
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_INSTALLATION_ID: ${{ secrets.GITHUB_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
